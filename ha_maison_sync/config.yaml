name: HA-maison Sync
version: "0.3.1"
slug: ha_maison_sync
description: Envoie ta config Home Assistant vers GitHub (pour que Claude la consulte) et applique ses modifications en un clic, avec sauvegarde et retour arrière.
url: https://github.com/XeIaCraft/HA-maison-addon
arch:
  - aarch64
  - amd64
  - armv7
init: false
boot: manual
startup: application
ingress: true
ingress_port: 8099
panel_icon: mdi:home-sync
panel_title: HA-maison
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  branch: main
  apply_paths:
    - themes
    - dashboards
    - packages
  export_paths:
    - themes
    - dashboards
    - packages
    - automations.yaml
    - scripts.yaml
    - scenes.yaml
    - blueprints
  export_full: true
  restart_after_apply: false
  git_user_name: HA-maison Sync
  git_user_email: ha-maison-sync@localhost
schema:
  repository: str?
  branch: str
  apply_paths:
    - str
  export_paths:
    - str
  export_full: bool
  restart_after_apply: bool
  git_user_name: str
  git_user_email: str
